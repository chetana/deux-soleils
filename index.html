<!doctype html>
<html lang="km">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#cbe4f8">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Deux soleils">
<meta name="description" content="Deux soleils — les heures, le temps et les levers/couchers de soleil entre Montévrain et Trapeang Ampil">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Deux soleils ☀️">
<meta property="og:title" content="Deux soleils — Montévrain ↔ Trapeang Ampil">
<meta property="og:description" content="Les heures, la météo et les soleils des deux familles, en direct 🌞🌙">
<meta property="og:url" content="https://soleils.chetana.fr/">
<meta property="og:image" content="https://soleils.chetana.fr/og-2026.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Un soleil côté France, une lune côté Cambodge, reliés par le trajet d'un avion — Deux soleils">
<meta name="twitter:card" content="summary_large_image">
<title>Deux soleils ☀️ Montévrain ↔ Trapeang Ampil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%98%80%EF%B8%8F%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Noto+Sans+Khmer:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flag-icons@7.5.0/css/flag-icons.min.css">
<link rel="stylesheet" href="style.css?v=9">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

<!-- Filtres "pastel/craie" : traits irréguliers + grain papier -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="chalkSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6"/>
    </filter>
    <filter id="chalkEdge" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.4" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5"/>
    </filter>
    <filter id="paper">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42  0 0 0 0 0.47  0 0 0 0 0.58  0 0 0 0.6 0"/>
    </filter>
  </defs>
</svg>

<main>
  <!-- Carte France -->
  <section class="place" id="fr" aria-label="Montévrain, France">
    <div class="sky" id="sky-fr">
      <div class="stars" id="stars-fr"></div>
      <div class="sunmoon" id="orb-fr"></div>
      <div class="cloud c1"></div><div class="cloud c2"></div>
      <div class="hill h1"></div><div class="hill h2"></div>
    </div>
    <div class="card">
      <div class="head-row">
        <span class="fi fi-fr flag" aria-hidden="true"></span>
        <div class="names">
          <h2>Montévrain</h2>
          <p class="sub" lang="km">ម៉ុងតេវ្រែន · ស៊ែន អេ ម៉ារន</p>
        </div>
        <div class="clock">
          <span class="time" id="time-fr">--:--</span><span class="sec" id="sec-fr">--</span>
        </div>
      </div>
      <div class="statusbox">
        <svg class="sunpath" id="sunpath-fr" viewBox="0 0 120 70" aria-hidden="true">
          <path d="M10 62 Q60 -20 110 62" fill="none" stroke="#e5b96e" stroke-width="3" stroke-dasharray="5 8" opacity=".6" stroke-linecap="round"/>
          <circle id="arcdot-fr" r="6" cx="-20" cy="62" fill="#f2bc74" stroke="#fffdf5" stroke-width="2"/>
        </svg>
        <div class="status-text">
          <p class="status" lang="km" id="status-fr">…</p>
          <p class="status-fr" id="statusfr-fr">…</p>
        </div>
      </div>
      <div class="meta">
        <div class="meta-item wide">
          <span class="mi-label" lang="km">អាកាសធាតុ</span>
          <span class="mi-val"><span id="wx-fr">—</span> <b id="temp-fr">—</b></span>
        </div>
        <div class="meta-item half">
          <span class="mi-label" lang="km">ថ្ងៃរះ</span>
          <span class="mi-val"><span class="ico">🌅</span> <b id="rise-fr">--:--</b></span>
        </div>
        <div class="meta-item half">
          <span class="mi-label" lang="km">ថ្ងៃលិច</span>
          <span class="mi-val"><span class="ico">🌇</span> <b id="set-fr">--:--</b></span>
        </div>
      </div>
    </div>
  </section>

  <div class="link" aria-hidden="true">
    <svg viewBox="0 0 60 40" width="40" height="28">
      <path d="M6 20 Q30 -6 54 20" fill="none" stroke="#e8a0bd" stroke-width="2.5" stroke-dasharray="4 6" stroke-linecap="round"/>
      <g id="mini-plane"><path d="M2 0L-9-5 -6.5 0 -9 5Z" fill="#e8a0bd"/></g>
    </svg>
    <span class="gapline" id="gapline" lang="km">…</span>
    <span class="netstatus" id="net"></span>
  </div>

  <!-- Carte Cambodge -->
  <section class="place" id="kh" aria-label="Trapeang Ampil, Cambodge">
    <div class="sky" id="sky-kh">
      <div class="stars" id="stars-kh"></div>
      <div class="sunmoon" id="orb-kh"></div>
      <div class="cloud c1"></div><div class="cloud c2"></div>
      <div class="hill h1"></div><div class="hill h2"></div>
    </div>
    <div class="card">
      <div class="head-row">
        <span class="fi fi-kh flag" aria-hidden="true"></span>
        <div class="names">
          <h2>Trapeang Ampil</h2>
          <p class="sub" lang="km">ត្រពាំងអំពិល · ស្រុកសំរោងទង · កំពង់ស្ពឺ</p>
        </div>
        <div class="clock">
          <span class="time" id="time-kh">--:--</span><span class="sec" id="sec-kh">--</span>
        </div>
      </div>
      <div class="statusbox">
        <svg class="sunpath" id="sunpath-kh" viewBox="0 0 120 70" aria-hidden="true">
          <path d="M10 62 Q60 -20 110 62" fill="none" stroke="#e5b96e" stroke-width="3" stroke-dasharray="5 8" opacity=".6" stroke-linecap="round"/>
          <circle id="arcdot-kh" r="6" cx="-20" cy="62" fill="#f2bc74" stroke="#fffdf5" stroke-width="2"/>
        </svg>
        <div class="status-text">
          <p class="status" lang="km" id="status-kh">…</p>
          <p class="status-fr" id="statusfr-kh">…</p>
        </div>
      </div>
      <div class="meta">
        <div class="meta-item wide">
          <span class="mi-label" lang="km">អាកាសធាតុ</span>
          <span class="mi-val"><span id="wx-kh">—</span> <b id="temp-kh">—</b></span>
        </div>
        <div class="meta-item half">
          <span class="mi-label" lang="km">ថ្ងៃរះ</span>
          <span class="mi-val"><span class="ico">🌅</span> <b id="rise-kh">--:--</b></span>
        </div>
        <div class="meta-item half">
          <span class="mi-label" lang="km">ថ្ងៃលិច</span>
          <span class="mi-val"><span class="ico">🌇</span> <b id="set-kh">--:--</b></span>
        </div>
      </div>
    </div>
  </section>
</main>

<footer lang="km">ធ្វើដោយក្តីស្រឡាញ់ សម្រាប់ម៉ែ 💖 <span class="src" id="updated">—</span></footer>

<script src="app.js?v=9"></script>
</body>
</html>
